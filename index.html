<style>
body{background:#0A0E1A;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;padding-bottom:50px}

/* CODE SPLASH AJOUTÉ ICI */
#splash{position:fixed; top:0; left:0; width:100%; height:100%; background:#0A0E1A; display:flex; justify-content:center; align-items:center; z-index:9999; transition:opacity 0.5s;}
#splash img{width:200px; height:200px; border-radius:30px; box-shadow:0 0 40px rgba(59,130,246,0.5); animation:pulse 1.5s infinite;}
@keyframes pulse {0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); }}

<body>

<!-- SPLASH SCREEN AJOUTÉ ICI -->
<div id="splash">
  <div style="text-align:center;">
    <img src="splash.png" alt="MaraSo">
    <h1 style="color:white; margin-top:20px; font-size:28px;">MaraSo 2026</h1>
    <p style="color:#94A3B8;">Chargement de votre coffre...</p>
  </div>
</div>

<div class="box">
  <svg class="cadenas-svg" viewBox="0 0 24 24">
    <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#3B82F6"/><stop offset="100%" style="stop-color:#10B981"/></linearGradient></defs>
    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
  </svg>
  
  <h2 id="titre">Créer un compte</h2>
  <div class="sous">Coffre-fort MaraSo 2026</div>

  <input type="text" id="champ_email_2026" placeholder="Email ou Numéro" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');">
  <input type="password" id="champ_mdp_2026" placeholder="Mot de passe" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');">
  <div id="erreur" class="error"></div>
  <button id="btn">S'inscrire</button>
  <div class="switch" id="switch">J'ai déjà un compte</div>
</div>

<script>
localStorage.removeItem('maraso_user');
let users = JSON.parse(localStorage.getItem('maraso_users') || '[]');
let mode = "inscription";

const btn = document.getElementById('btn');
const switchBtn = document.getElementById('switch');
const email = document.getElementById('champ_email_2026');
const mdp = document.getElementById('champ_mdp_2026');
const erreur = document.getElementById('erreur');
const titre = document.getElementById('titre');

function showError(msg){ erreur.innerText=msg; erreur.style.display="block"; }

switchBtn.addEventListener('click', function(){
  if(mode=="inscription"){
    mode="connexion"; titre.innerText="Connexion"; btn.innerText="Se connecter"; this.innerText="Créer un compte";
  }else{
    mode="inscription"; titre.innerText="Créer un compte"; btn.innerText="S'inscrire"; this.innerText="J'ai déjà un compte";
  }
  erreur.style.display="none"; email.value=""; mdp.value="";
});

btn.addEventListener('click', function(){
  let e=email.value.trim(); let p=mdp.value;
  if(e==""){showError("Entre ton email"); return}
  if(p.length<8){showError("8 caractères minimum"); return}
  erreur.style.display="none";
  
  if(mode=="inscription"){
    auth.createUserWithEmailAndPassword(e, p)
    .then(()=>{
      if(window.admob) admob.interstitial.show();
      users.push(e); localStorage.setItem('maraso_users',JSON.stringify(users));
      localStorage.setItem('maraso_user',e); window.location="accueil.html";
    })
    .catch(error => {showError(error.message);});
    
  }else{
    auth.signInWithEmailAndPassword(e, p)
    .then(()=>{
      if(window.admob) admob.interstitial.show();
      localStorage.setItem('maraso_user',e); window.location="accueil.html";
    })
    .catch(()=>{
      if(e=="admin" && p=="admin123"){localStorage.setItem('maraso_user',e);window.location="accueil.html";}
      else if(users.includes(e)){localStorage.setItem('maraso_user',e);window.location="accueil.html";}
      else{showError("Email ou mot de passe incorrect");}
    });
  }
});

// CODE SPLASH AJOUTÉ ICI : Cache après 2.5s
window.addEventListener('load', function() {
  setTimeout(function() {
    document.getElementById('splash').style.opacity = '0';
    setTimeout(function() {
      document.getElementById('splash').style.display = 'none';
    }, 500);
  }, 2500);
});
</script>
</body>
</html>
